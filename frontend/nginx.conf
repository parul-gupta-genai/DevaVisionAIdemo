server {
    listen 80;
    server_name localhost;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy ALL backend API prefixes
    location /auth/ { proxy_pass http://backend:8000/auth/; }
    location /users/ { proxy_pass http://backend:8000/users/; }
    location /roles/ { proxy_pass http://backend:8000/roles/; }
    location /cameras/ { proxy_pass http://backend:8000/cameras/; }
    location /system/ { proxy_pass http://backend:8000/system/; }
    location /admin/ { proxy_pass http://backend:8000/admin/; }
    location /config/ { proxy_pass http://backend:8000/config/; }
    location /api/ { proxy_pass http://backend:8000/api/; }
    location /anpr/ { proxy_pass http://backend:8000/anpr/; }
    location /visitor/ { proxy_pass http://backend:8000/visitor/; }

    # Proxy WebRTC WHEP signaling to MediaMTX (same path the Vite dev proxy uses)
    location /webrtc-stream/ {
        proxy_pass http://mediamtx:8189/;
    }

    # Proxy Snapshots
    location /snapshots/ {
        proxy_pass http://backend:8000/snapshots/;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
